name: Build & test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: End-to-end tests (real Electron app)
        run: |
          npx playwright install-deps chromium
          npm i --no-save playwright@1
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: test/.tmp/shots, if-no-files-found: ignore }

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: SmartScan-Windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
